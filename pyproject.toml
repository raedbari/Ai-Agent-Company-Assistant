[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "travelx-customer-agent"
version = "0.1.0"
description = "Travel-X customer-service agent backend"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi[standard]>=0.115,<1.0",
    "langchain>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langgraph>=1.2,<2.0",
    "langsmith>=0.10,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "alembic>=1.14,<2.0",
    "asyncpg>=0.30,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "redis>=5.2,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest-asyncio>=0.25,<2.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.9,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/travelx_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
